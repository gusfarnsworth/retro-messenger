name: Build signed Retro Messenger for Windows

# Release only after you explicitly start this workflow. The GitHub release
# starts as a draft so you can test the installer before publishing it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Verify updater public settings
        run: npm run updater:verify

      - name: Create signed NSIS installer and draft GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'Retro Messenger v__VERSION__'
          releaseBody: |
            Retro Messenger for Windows (x64).

            Download the NSIS setup executable to install Retro Messenger.
            Signed update artifacts and latest.json are for automatic updates.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: '--bundles nsis'

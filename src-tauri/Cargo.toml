[package]
name = "retro-messenger"
version = "1.1.1"
description = "Retro Messenger desktop client"
authors = ["Retro Messenger"]
edition = "2021"

[lib]
name = "retro_messenger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
